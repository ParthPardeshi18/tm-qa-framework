red_flags_identified:
  - "Activity materially above the profile: credits of 415,033.48 and debits of 1,303,179.08 in the 90-day lookback against declared income of 60,000–100,000 and expected monthly credits of 5,000–8,333."
  - "Single very large payment: a credit-card debit of 611,469.67 to 5639188408, which also sent 2 credit-card credits totalling 101,661.05."
  - "Funding gap: debits exceed credits by 888,145.60, with March 2023 debits of about 787,000. Opening balance is unavailable and the investigator data contains no activity before 2023-02-17."
  - "Concentrated payees: 7104124133 (5 debits, 208,728.93), 629877861 (5, 95,954.85) and 4508233555 (9, 91,284.20)."
  - "TM02 trigger: a credit of 56,363.34 and 6 debits totalling 93,649.89 (166%) on 16–17 May 2023."
  - "Cross-border debits: 5 payments totalling 11,735.87 to India-located recipients (not on the project watchlist)."
source_of_funds: >
  Source of funds is unresolved. Credits of 415,033.48 came from six senders, mainly by cheque
  (245,279) and credit card (101,661) — well above salary for the declared occupation. The
  611,469.67 payment and other outflows exceed credits by 888,145.60, so substantial funds not
  visible in the case pack were used.

  Source of wealth is relevant: a single payment of 611,469.67 is about six years of income at the
  top of the declared band. A high-earning customer could hold savings or assets that explain it,
  but none are evidenced.

  Investigative actions not evidenced as completed in the case pack: establishing the purpose of
  the 611,469.67 payment and the relationship with 5639188408; identifying the main senders and
  payees; and obtaining the balance and earlier history.

  The source of funds and source of wealth cannot be treated as established or verified on the
  available record.
screening_adverse_media: >
  No screening results are available in the simulation dataset; screening outcomes cannot be
  verified. The synthetic customer profile records PEP No and adverse media No as KYC flags on
  file; these are profile attributes, not evidence of completed screening or clear results.

  Screening of the customer and material counterparties is not evidenced as completed in the case
  pack. Parties for assessment: the customer; 5639188408; senders 4844933498, 6401567841 and
  903189007; payees 7104124133, 629877861 and 4508233555; and the India-located recipients. The
  data contains account identifiers and bank locations but no names, so screening outcomes cannot
  be verified; adverse-media and PEP checks on material counterparties are also not evidenced as
  completed.

  The cross-border activity raises a sanctions-control consideration. The available evidence does
  not establish any sanctions match or connection to a sanctioned person or entity. Appearance on
  the project's historical June 2023 jurisdiction watchlist is not, by itself, evidence of a
  sanctions match.
rationale: >
  The material concerns are not resolved, but on the current record I do not yet form a suspicion;
  specialist assessment of the funding is needed.

  Weight is given to the size of the outflows (1,303,179.08 in 90 days) and the funding gap
  (888,145.60), dominated by one payment of 611,469.67 to a counterparty that also paid the
  customer 101,661.05. A single very large payment is consistent with a major purchase, such as
  property, funded from savings or the proceeds of an asset held elsewhere, which would also
  explain why outflows exceed credits. The customer is in the highest income band of the cases
  reviewed, and credits come from a small number of identifiable payers rather than a multi-party
  burst. The TM02 trigger (166% out within two days) is consistent with ordinary payment timing
  and is given limited weight.

  Legitimate explanations considered include a property or asset purchase, transfers from own
  savings and repayment of a loan with 5639188408. None is substantiated, but the evidence that
  would test them (balance, history, payment purpose) is outside the case pack rather than
  contradicted by it.

  Limitations: the transaction currency is unverified; the customer profile is synthetic and is
  the KYC record against which activity is assessed in this simulation; the jurisdiction watchlist
  is a single June 2023 snapshot rather than a classification verified for the transaction dates;
  and the meaning of Sender_account for cash deposits is undocumented. These limitations reduce
  precision but do not change the assessment that the key gap is the funding and purpose of the
  large payment.

  ESCALATE_L2 is proportionate. If specialist review cannot establish a legitimate purpose and
  funding source, internal disclosure must follow promptly.
disposition: ESCALATE_L2
escalation_decision: >
  Refer to the L2 Transaction Monitoring team for specialist assessment of: (1) the purpose of the
  611,469.67 payment and the relationship with 5639188408; (2) the balance and activity before
  2023-02-17 to establish how debits exceeding credits by 888,145.60 were funded; (3) the identity
  of the main senders and payees; and (4) screening of the customer and those counterparties.

  Internal disclosure is not made at this stage because the pattern is dominated by a single large
  payment consistent with a major purchase by a higher-income customer, and the evidence needed to
  test that explanation is not in the case pack.

  Any request for information is to be agreed with L2 or the MLRO and worded neutrally; the
  tipping-off restriction (POCA s.333A) applies if suspicion is later formed.

  Recommend a CDD refresh and customer risk-rating review: the recorded rating of Medium and
  expected monthly credits of 5,000–8,333 require reassessment against the observed activity.
  Assign to the CDD/KYC owner with a due date in the restricted remediation tracker; any
  customer-facing refresh request is assessed first so that it does not disclose the internal
  report or prejudice an investigation. These actions do not replace the escalation.

  No internal disclosure is made at this stage, so the disclosure-tracking fields are null. The
  simulation contains no case-handling record, so opening and closure dates are not recorded. If
  L2 or any later review forms a suspicion, prompt internal disclosure to the nominated
  officer/MLRO is required and must not wait for completion of L2 work. The firm's detailed
  escalation procedure is not available in this simulation.
