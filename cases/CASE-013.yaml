red_flags_identified:
  - "Burst of credits inconsistent with the declared business: 229 credits totalling 1,985,812.49 from 20 senders between 4 and 10 November 2022, against declared turnover of 0–50,000 a year (expected monthly credits 0–4,167)."
  - "Repetitive multi-sender pattern: the largest senders each made 12 payments — 9772960341 (171,943.70), 8261415464 (168,136.18), 3197083957 (151,481.76) and 4039382787 (142,346.02); this includes 12 cross-border credits totalling 141,892.28 from a Netherlands-located sender."
  - "Large prior outflow with no visible funding: a debit-card payment of 312,436.64 to 6255326346 in October 2022, when credits were 3,894.73."
  - "Funds retained: only 3 debits totalling 8,175.19 in the alert window."
  - "Cash deposits of 3,894.73 (12 October 2022) and 3,755.00 (10 November 2022) recorded against identifier 7762983812."
source_of_funds: >
  Source of funds is unresolved. Credits of 1,985,812.49 arrived from 20 senders within seven
  days, the main senders each making 12 payments. Receipts on this scale are inconsistent with a
  hairdressing business declared at 0–50,000 a year, and the October payment of 312,436.64 was
  funded from money not visible in the case pack.

  Source of wealth is relevant to the business's owners; no business accounts or ownership
  information are available.

  Investigative actions not evidenced as completed in the case pack: identifying the senders and
  the business purpose of the payments; establishing the purpose of the 312,436.64 payment; and
  obtaining the balance and business records.

  The source of funds and source of wealth cannot be treated as established or verified on the
  available record.
screening_adverse_media: >
  No screening results are available in the simulation dataset; screening outcomes cannot be
  verified. The synthetic customer profile records PEP No and adverse media No as KYC flags on
  file; these are profile attributes, not evidence of completed screening or clear results.

  Screening of the customer and material counterparties is not evidenced as completed in the case
  pack. Parties for assessment: the customer and its owners or controllers; senders 9772960341,
  8261415464, 3197083957 and 4039382787; the Netherlands-located sender; and payee 6255326346. The
  data contains account identifiers and bank locations but no names, so screening outcomes cannot
  be verified; adverse-media and PEP checks on material counterparties are also not evidenced as
  completed.

  The cross-border activity raises a sanctions-control consideration. The available evidence does
  not establish any sanctions match or connection to a sanctioned person or entity. Appearance on
  the project's historical June 2023 jurisdiction watchlist is not, by itself, evidence of a
  sanctions match.
rationale: >
  The material concerns are not resolved on the available record. I suspect the customer is
  engaged in money laundering, with the business account used to collect funds from multiple
  senders.

  The greatest weight is given to the receipt of 1,985,812.49 from 20 senders within a week, the
  main senders each making exactly 12 payments, into a business declared at 0–50,000 a year.
  Business receipts would not normally show identical repetition across 20 payers within a single
  week. The earlier payment of 312,436.64, funded from money not visible, adds weight. The cash
  deposits are small and carry little weight.

  [Correction 2026-10-21: references to two later-dated alerts, listed in error in the original
  case pack, were removed; they were not relied upon.] The lookback is 35 days because the data starts on 2022-10-07;
  this is a dataset limitation.

  Legitimate explanations considered include a large commercial contract and business growth.
  Neither explains 20 payers each making 12 payments within a week, and neither is substantiated.

  Limitations: the transaction currency is unverified; the customer profile is synthetic and is
  the KYC record against which activity is assessed in this simulation; the jurisdiction watchlist
  is a single June 2023 snapshot rather than a classification verified for the transaction dates;
  and the meaning of Sender_account for cash deposits is undocumented. These limitations reduce
  precision but do not resolve the multi-sender collection pattern on which the suspicion is
  based.

  I therefore recommend prompt internal disclosure. This is a suspicion, not a finding that
  criminality is proven; the MLRO decides whether an external SAR is required. The record does not
  establish a terrorist-financing suspicion or a sanctions match.
disposition: ESCALATE_SAR
escalation_decision: >
  Make a prompt internal disclosure to the nominated officer/MLRO. This is not an L2-only
  referral. Disclosure summary: 229 credits totalling 1,985,812.49 from 20 senders between 4 and
  10 November 2022, the main senders each making 12 payments, including 141,892.28 from a
  Netherlands-located sender; a prior payment of 312,436.64 to 6255326346 funded from money not
  visible.

  Material counterparties to include: 9772960341, 8261415464, 3197083957, 4039382787, 6255326346.

  Follow-up actions, routed alongside the disclosure without delaying it: obtain balance and
  business records; screen the customer, its controllers and the counterparties listed. Owner: the
  TM/L2 team or the MLRO, as determined under the firm's procedure (not available in this
  simulation).

  The investigator must not tell the customer or counterparties that an internal disclosure has
  been made or that an investigation is contemplated or being conducted, where that would be
  likely to prejudice an investigation (POCA s.333A). This is not a blanket bar on customer
  contact: any request for information is to be agreed with the MLRO or an appropriate specialist
  and worded neutrally.

  The case pack does not identify a pending transaction requiring a consent decision. If a
  proposed transaction may constitute a money laundering offence and the firm intends to proceed,
  the matter is referred to the MLRO, who decides whether a DAML request is required. The
  investigator does not seek a DAML or restrict or release account activity outside delegated
  authority.

  Recommend a CDD refresh and customer risk-rating review: the recorded rating of Medium and
  expected monthly credits of 0–4,167 require reassessment against the observed activity. Assign
  to the CDD/KYC owner with a due date in the restricted remediation tracker; any customer-facing
  refresh request is assessed first so that it does not disclose the internal report or prejudice
  an investigation. These actions do not replace the escalation.

  Timing: the project's operational target is internal disclosure on the same working day that
  suspicion is formed; the statutory requirement, where POCA s.330 applies, is disclosure as soon
  as is practicable. The simulation contains no record of when suspicion was formed or the
  disclosure was made, so the disclosure-tracking fields are left null rather than estimated, and
  case opening and closure dates are not recorded.
