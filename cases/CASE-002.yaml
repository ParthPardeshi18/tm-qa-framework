red_flags_identified:
  - "Outflows materially inconsistent with the declared business: 80 debits totalling 256,326.93 to 23 receivers in the 90-day lookback (about 64k–77k per full month) against declared turnover of 0–50,000 a year and expected monthly credits of 0–4,167."
  - "Funding of outflows not visible: the only credits are 6 cash deposits totalling 16,804.17, so debits exceed credits by 239,522.76. Opening balance is unavailable and the investigator data contains no activity before 2023-02-18."
  - "Consecutive daily cash deposits triggering TM01 (per transaction-level review): 2,070.05, 3,197.82, 4,241.28 and 3,800.96 on 15–18 May 2023 (13,310.11), all recorded against identifier 5469235956; three fell in the 3,000–5,999.99 band (11,240.06). Earlier deposits of 2,903.36 and 590.70 were recorded against identifier 9073614033."
  - "Concentrated domestic payees: 1797551721 (7 debits, 70,431.07), 9931229430 (4, 37,188.91), 8872648210 (6, 25,175.27) and 6722284586 (3, 22,844.65)."
  - "Small recurring cross-border payments: 3 debits totalling 2,304.39 to one Nigeria-located recipient (8284454744) on 19 February, 9 April and 3 May 2023, and 2 debits totalling 788.61 to one Switzerland-located recipient (9478434202)."
source_of_funds: >
  Source of funds is unresolved. In the 90-day lookback the account's only credits are cash
  deposits (16,804.17). Cash deposits are consistent in type with a hairdressing business, but May
  credits of 13,900.81 in 30 days exceed the expected monthly maximum of 4,167. Debits of
  256,326.93 cannot be funded from these credits, and the source of the remaining funds (an
  opening balance, earlier receipts or funds introduced from elsewhere) is not visible. The
  meaning of Sender_account for cash deposits is undocumented, so the depositor and origin of the
  cash cannot be established from that field.

  Source of wealth is relevant because the business's spending capacity appears far greater than
  its declared turnover; no accounts, business records or wealth information are available.

  Investigative actions not evidenced as completed in the case pack: obtaining the account balance
  and activity before 2023-02-18; establishing the purpose of payments to the main payees;
  establishing the origin of the cash deposits; and confirming current business turnover.

  The source of funds and source of wealth cannot be treated as established or verified on the
  available record.
screening_adverse_media: >
  No screening results are available in the simulation dataset; screening outcomes cannot be
  verified. The synthetic customer profile records PEP No and adverse media No as KYC flags on
  file; these are profile attributes, not evidence of completed screening or clear results.

  Screening of the customer and material counterparties is not evidenced as completed in the case
  pack. Parties for assessment: the customer and its owners or controllers; the main domestic
  payees 1797551721, 9931229430, 8872648210, 6722284586 and 1680247748; the Nigeria-located
  recipient 8284454744; and the Switzerland-located recipient 9478434202. The data contains
  account identifiers and bank locations but no names, so screening outcomes cannot be verified;
  adverse-media and PEP checks on material counterparties are also not evidenced as completed.

  The cross-border activity raises a sanctions-control consideration. The available evidence does
  not establish any sanctions match or connection to a sanctioned person or entity. Appearance on
  the project's historical June 2023 jurisdiction watchlist is not, by itself, evidence of a
  sanctions match.
rationale: >
  The material concerns are not resolved, but on the current record they do not yet support a
  suspicion. The decisive gap is that most of the account's funding is not visible: debits of
  256,326.93 against credits of 16,804.17, with no balance and no earlier history in the
  investigator data.

  The TM01 trigger is given limited weight. Four deposits on consecutive days from one identifier,
  rising in size with one just below the band, are a pattern to note, but regular deposits of
  takings are expected for a cash-handling business and the amounts are uneven. The more
  significant concern is scale: spending of about 64k–77k per full month is many times the
  declared turnover, and the purpose of the repeat domestic payments and the small recurring
  overseas payments is unexplained.

  Legitimate explanations considered include an existing balance or business reserves, funds
  introduced by the owner, and outdated KYC (the business may have grown beyond its declared
  turnover). Each is untested but remains plausible, because the evidence that would confirm or
  exclude it (balance, history, business records) is outside the case pack rather than
  contradicted by it. The Nigeria payments are small (2,304.39 in total) and carry little weight
  on their own.

  Limitations: the transaction currency is unverified; the customer profile is synthetic and is
  the KYC record against which activity is assessed in this simulation; the jurisdiction watchlist
  is a single June 2023 snapshot rather than a classification verified for the transaction dates;
  and the meaning of Sender_account for cash deposits is undocumented. These limitations reduce
  precision but do not alter the assessment that the record is incomplete rather than indicative
  of laundering.

  ESCALATE_L2 is proportionate: specialist review is needed to establish the funding picture
  before a suspicion can be formed or excluded. If a suspicion is formed, internal disclosure must
  not be delayed.
disposition: ESCALATE_L2
escalation_decision: >
  Refer to the L2 Transaction Monitoring team for specialist assessment of: (1) the account
  balance and activity before 2023-02-18, to establish how outflows of 256,326.93 were funded; (2)
  the purpose of payments to 1797551721, 9931229430, 8872648210, 6722284586 and 1680247748; (3)
  the origin of cash deposits recorded against identifiers 5469235956 and 9073614033; and (4)
  screening of the customer and material counterparties, including Nigeria-located recipient
  8284454744.

  Internal disclosure is not made at this stage because the observed activity (cash takings and
  business-type payments) is consistent with an under-declared but legitimate business and the key
  unknown, how the outflows were funded, is a gap in the record rather than an observed suspicious
  pattern.

  Any request for information is to be agreed with L2 or the MLRO and worded neutrally; the
  tipping-off restriction (POCA s.333A) applies if suspicion is later formed.

  Recommend a CDD refresh and customer risk-rating review: the recorded rating of Medium and
  expected monthly credits of 0–4,167 require reassessment against the observed activity. Assign
  to the CDD/KYC owner with a due date in the restricted remediation tracker; any customer-facing
  refresh request is assessed first so that it does not disclose the internal report or prejudice
  an investigation. These actions do not replace the escalation.

  No internal disclosure is made at this stage, so the disclosure-tracking fields are null. The
  simulation contains no case-handling record, so opening and closure dates are not recorded. If
  L2 or any later review forms a suspicion, prompt internal disclosure to the nominated
  officer/MLRO is required and must not wait for completion of L2 work. The firm's detailed
  escalation procedure is not available in this simulation.
