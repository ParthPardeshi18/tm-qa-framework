red_flags_identified:
  - "Burst of credits inconsistent with the declared business: 150 credits totalling 1,298,069.54 from 15 senders between 29 May and 27 June 2023 (37.5 times the baseline monthly average of 34,602.35), against declared turnover of 50,000–250,000 and expected monthly credits of 4,167–20,833."
  - "Repetitive multi-sender pattern: the largest senders each made 12 payments — 1456864705 (166,183.35), 1400786194 (156,317.04), 9340895954 (136,627.25) and 6307147139 (130,772.17)."
  - "Funds largely retained: 83 debits totalling 194,074.16 to 25 receivers across the lookback, spread across ACH, cheque and card (including 12 to 5797744505, 31,250.23), leaving net retention of 1,167,799.87."
  - "Cash deposits: 8 deposits totalling 13,298.85 from three identifiers, ranging from 426.60 to 5,453.92 (per transaction-level review)."
  - "Small cross-border debits: Spain (2,914.27), France (3 payments, 573.17) and Albania (284.56, watchlist)."
source_of_funds: >
  Source of funds is unresolved. Credits of 1,298,069.54 arrived from 15 senders within 30 days,
  the main senders each making 12 payments. The account's outgoings are business-like and
  proportionate to the earlier activity, but the receipts are more than 60 times the expected
  monthly maximum and their commercial basis is not evidenced.

  Source of wealth is relevant to the business's owners; no business accounts or ownership
  information are available.

  Investigative actions not evidenced as completed in the case pack: identifying the senders and
  the commercial basis of the payments; establishing current business turnover; and obtaining
  business records.

  The source of funds and source of wealth cannot be treated as established or verified on the
  available record.
screening_adverse_media: >
  No screening results are available in the simulation dataset; screening outcomes cannot be
  verified. The synthetic customer profile records PEP No and adverse media No as KYC flags on
  file; these are profile attributes, not evidence of completed screening or clear results.

  Screening of the customer and material counterparties is not evidenced as completed in the case
  pack. Parties for assessment: the customer and its owners or controllers; senders 1456864705,
  1400786194, 9340895954 and 6307147139; payee 5797744505; and the Spain-located, France-located
  and Albania-located recipients. The data contains account identifiers and bank locations but no
  names, so screening outcomes cannot be verified; adverse-media and PEP checks on material
  counterparties are also not evidenced as completed.

  The cross-border activity raises a sanctions-control consideration. The available evidence does
  not establish any sanctions match or connection to a sanctioned person or entity. Appearance on
  the project's historical June 2023 jurisdiction watchlist is not, by itself, evidence of a
  sanctions match.
rationale: >
  The material concerns are not resolved on the available record. I suspect the customer is
  engaged in money laundering, with the business account used to collect third-party funds.

  The greatest weight is given to the receipt of 1,298,069.54 from 15 senders within a month, the
  main senders each making exactly 12 payments, more than 60 times the declared expected maximum.
  The account's outgoings look like ordinary business expenditure, which is why the alternative of
  large trade receipts was considered carefully; but identical payment counts across 15 senders in
  a single month are not consistent with ordinary trade receipts for a retail shop. The cash
  deposits and cross-border payments are small and carry little weight.

  Legitimate explanations considered include a large trade contract and business growth not
  reflected in KYC. Neither explains identical repetition across 15 senders, and neither is
  substantiated. A reviewer could treat this as borderline given the business-like outgoings.

  Limitations: the transaction currency is unverified; the customer profile is synthetic and is
  the KYC record against which activity is assessed in this simulation; the jurisdiction watchlist
  is a single June 2023 snapshot rather than a classification verified for the transaction dates;
  and the meaning of Sender_account for cash deposits is undocumented. These limitations reduce
  precision but do not resolve the multi-sender pattern on which the suspicion is based.

  I therefore recommend prompt internal disclosure. This is a suspicion, not a finding that
  criminality is proven; the MLRO decides whether an external SAR is required. The record does not
  establish a terrorist-financing suspicion or a sanctions match.
disposition: ESCALATE_SAR
escalation_decision: >
  Make a prompt internal disclosure to the nominated officer/MLRO. This is not an L2-only
  referral. Disclosure summary: 150 credits totalling 1,298,069.54 from 15 senders between 29 May
  and 27 June 2023, the main senders each making 12 payments, against expected monthly credits of
  4,167–20,833; net retention of 1,167,799.87.

  Material counterparties to include: 1456864705, 1400786194, 9340895954, 6307147139, 5797744505.

  Follow-up actions, routed alongside the disclosure without delaying it: obtain business records;
  screen the customer, its controllers and the counterparties listed. Owner: the TM/L2 team or the
  MLRO, as determined under the firm's procedure (not available in this simulation).

  The investigator must not tell the customer or counterparties that an internal disclosure has
  been made or that an investigation is contemplated or being conducted, where that would be
  likely to prejudice an investigation (POCA s.333A). This is not a blanket bar on customer
  contact: any request for information is to be agreed with the MLRO or an appropriate specialist
  and worded neutrally.

  The case pack does not identify a pending transaction requiring a consent decision. If a
  proposed transaction may constitute a money laundering offence and the firm intends to proceed,
  the matter is referred to the MLRO, who decides whether a DAML request is required. The
  investigator does not seek a DAML or restrict or release account activity outside delegated
  authority.

  Recommend a CDD refresh and customer risk-rating review: the recorded rating of Medium and
  expected monthly credits of 4,167–20,833 require reassessment against the observed activity.
  Assign to the CDD/KYC owner with a due date in the restricted remediation tracker; any
  customer-facing refresh request is assessed first so that it does not disclose the internal
  report or prejudice an investigation. These actions do not replace the escalation.

  Timing: the project's operational target is internal disclosure on the same working day that
  suspicion is formed; the statutory requirement, where POCA s.330 applies, is disclosure as soon
  as is practicable. The simulation contains no record of when suspicion was formed or the
  disclosure was made, so the disclosure-tracking fields are left null rather than estimated, and
  case opening and closure dates are not recorded.
