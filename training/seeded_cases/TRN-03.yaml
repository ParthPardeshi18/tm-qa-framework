red_flags_identified:
- 'Large credit passed on within two days: a cheque credit of 58,911.37 from 7556603312 and a cheque debit
  of 53,513.26 to 24488031 (91%) on 11–12 January 2023.'
- 'Two-way transfer with one counterparty (per transaction-level review): a cross-border credit of 29,722.71
  from 9159945769 and a cross-border debit of 30,058.85 to the same identifier; both record the account
  at a USA bank location, which may be a data-quality issue.'
- 'Activity materially inconsistent with the profile: credits of 90,598.10 and debits of 186,755.16 in
  the 90-day lookback against declared income of 10,000–25,000 and expected monthly credits of 833–2,083.'
- 'Recurring payee: 12 ACH debits totalling 62,815.53 to 8036405329.'
- 'Funding gap: debits exceed credits by 96,157.06, with October–November debits of about 120,000 and
  no credits in that period. Opening balance is unavailable.'
source_of_funds: 'Source of funds is unresolved. The account received three credits: a cheque of 58,911.37,
  a cross-border credit of 29,722.71 and a cash deposit of 1,964.02. Two were largely matched by outgoing
  payments within a short time, so the account''s own funding of the October–November debits (about 120,000
  with no credits) is not visible.

  Source of wealth is relevant because outflows of 186,755.16 in 90 days exceed several years of declared
  income; no asset or wealth information is available.

  Investigative actions not evidenced as completed in the case pack: identifying 7556603312, 24488031
  and 9159945769 and their relationship to the customer; establishing the purpose of the matched transfers
  and the recurring payments to 8036405329; and obtaining the balance.

  The source of funds and source of wealth cannot be treated as established or verified on the available
  record.

  '
screening_adverse_media: 'No screening results are available in the simulation dataset; screening outcomes
  cannot be verified. The synthetic customer profile records PEP No and adverse media No as KYC flags
  on file; these are profile attributes, not evidence of completed screening or clear results.

  Screening of the customer and material counterparties is not evidenced as completed in the case pack.
  Parties for assessment: the customer; 7556603312; 24488031; 9159945769; and recurring payee 8036405329.
  The data contains account identifiers and bank locations but no names, so screening outcomes cannot
  be verified; adverse-media and PEP checks on material counterparties are also not evidenced as completed.

  The cross-border activity raises a sanctions-control consideration. The available evidence does not
  establish any sanctions match or connection to a sanctioned person or entity. Appearance on the project''s
  historical June 2023 jurisdiction watchlist is not, by itself, evidence of a sanctions match.

  '
rationale: 'The material concerns are not resolved, and the activity needs specialist assessment, but
  I do not yet form a suspicion on this record.

  Weight is given to the rapid movement of 58,911.37 in and 53,513.26 out within two days, and to the
  near-matched transfer of 29,722.71 in and 30,058.85 out with the same counterparty. Both are inconsistent
  with the profile of a care worker. However, the activity consists of a small number of large, discrete
  transfers with identifiable counterparties, not a multi-party dispersal or repeated structured pattern.
  Discrete transfers of this kind can have legitimate explanations (for example a family property or loan
  arrangement) that only counterparty identification can test.

  Legitimate explanations considered include transfers between family members or related accounts, a loan
  advanced and repaid, and a one-off purchase. None is substantiated, but none is contradicted by the
  evidence available.

  Limitations: the transaction currency is unverified; the customer profile is synthetic and is the KYC
  record against which activity is assessed in this simulation; the jurisdiction watchlist is a single
  June 2023 snapshot rather than a classification verified for the transaction dates; and the meaning
  of Sender_account for cash deposits is undocumented. These limitations reduce precision but do not resolve
  the open questions about counterparties and purpose.

  ESCALATE_L2 is proportionate: the decisive evidence (who the counterparties are and why the funds moved)
  requires specialist assessment. If that review forms a suspicion, internal disclosure must not be delayed.

  '
disposition: ESCALATE_L2
escalation_decision: 'Refer to the L2 Transaction Monitoring team for specialist assessment of: (1) the
  identity of 7556603312, 24488031 and 9159945769 and their relationship to the customer; (2) the purpose
  of the 58,911.37 / 53,513.26 cheque movement and the 29,722.71 / 30,058.85 transfers; (3) the recurring
  payments to 8036405329; (4) the balance funding October–November debits; and (5) confirmation of the
  USA bank-location records.

  Internal disclosure is not made at this stage because the activity is a small number of discrete transfers
  with identifiable counterparties, consistent with either a pass-through or a legitimate private arrangement,
  and the evidence needed to distinguish them is not in the case pack.

  Any request for information is to be agreed with L2 or the MLRO and worded neutrally; the tipping-off
  restriction (POCA s.333A) applies if suspicion is later formed.

  Recommend a CDD refresh and customer risk-rating review: the recorded rating of Low and expected monthly
  credits of 833–2,083 require reassessment against the observed activity. Assign to the CDD/KYC owner
  with a due date in the restricted remediation tracker; any customer-facing refresh request is assessed
  first so that it does not disclose the internal report or prejudice an investigation. These actions
  do not replace the escalation.

  No internal disclosure is made at this stage, so the disclosure-tracking fields are null. The simulation
  contains no case-handling record, so opening and closure dates are not recorded. If L2 or any later
  review forms a suspicion, prompt internal disclosure to the nominated officer/MLRO is required and must
  not wait for completion of L2 work. The firm''s detailed escalation procedure is not available in this
  simulation.

  '
