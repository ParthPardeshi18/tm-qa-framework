red_flags_identified:
- 'Burst of credits inconsistent with the profile: 218 credits totalling 2,083,781.32 from 20 senders
  between 3 and 9 March 2023, against declared income of 0–10,000 and expected monthly credits of 0–833.'
- 'Repetitive multi-sender pattern: the largest senders each made 12 payments — 5256975073 (317,771.10),
  4063217673 (149,981.12), 2531083492 (148,068.32, Japan-located) and 3589086554 (140,655.25).'
- 'Outflows: a cross-border debit of 42,398.74 to a Germany-located recipient (1977207928) in March 2023
  and 12 debits totalling 21,298.85 to 1431954327 in February 2023.'
- 'Funds largely retained: lookback debits of 63,697.59 against credits of 2,090,894.46.'
- Cash deposits of 1,876.02 and 5,237.12 in January 2023 recorded against identifier 6751812053.
source_of_funds: 'Source of funds is unresolved. Credits of 2,083,781.32 arrived from 20 senders within
  seven days into a student account, the main senders each making 12 payments. Neither the senders'' relationship
  to the customer nor the purpose of the payments is evidenced.

  Source of wealth is relevant because the funds received are more than 200 times the upper end of declared
  annual income; no asset or wealth information is available.

  Investigative actions not evidenced as completed in the case pack: identifying the senders and their
  relationship to the customer; establishing the purpose of the payments and of the Germany-located payment;
  and confirming whether funds have since been moved on.

  The source of funds and source of wealth cannot be treated as established or verified on the available
  record.

  '
screening_adverse_media: 'No screening results are available in the simulation dataset; screening outcomes
  cannot be verified. The synthetic customer profile records PEP No and adverse media No as KYC flags
  on file; these are profile attributes, not evidence of completed screening or clear results.

  Screening of the customer and material counterparties is not evidenced as completed in the case pack.
  Parties for assessment: the customer; senders 5256975073, 4063217673, 2531083492 (Japan-located) and
  3589086554; and recipients 1977207928 (Germany-located) and 1431954327. The data contains account identifiers
  and bank locations but no names, so screening outcomes cannot be verified; adverse-media and PEP checks
  on material counterparties are also not evidenced as completed.

  The cross-border activity raises a sanctions-control consideration. The available evidence does not
  establish any sanctions match or connection to a sanctioned person or entity. Appearance on the project''s
  historical June 2023 jurisdiction watchlist is not, by itself, evidence of a sanctions match.

  '
rationale: 'The material concerns are not resolved on the available record. I suspect the customer is
  engaged in money laundering, with the account used to collect funds from multiple senders.

  The greatest weight is given to the receipt of 2,083,781.32 from 20 senders within a week into a student
  account, the main senders each making exactly 12 payments, with no visible purpose. The Germany-located
  payment of 42,398.74 shows some onward movement; most funds were retained at the alert date. The cash
  deposits are small and carry little weight.

  Legitimate explanations considered include family support and a scholarship or inheritance. None explains
  repeated payments from 20 senders, and none is substantiated.

  Limitations: the transaction currency is unverified; the customer profile is synthetic and is the KYC
  record against which activity is assessed in this simulation; the jurisdiction watchlist is a single
  June 2023 snapshot rather than a classification verified for the transaction dates; and the meaning
  of Sender_account for cash deposits is undocumented. These limitations reduce precision but do not resolve
  the multi-sender collection pattern on which the suspicion is based.

  I therefore recommend prompt internal disclosure. This is a suspicion, not a finding that criminality
  is proven; the MLRO decides whether an external SAR is required. The record does not establish a terrorist-financing
  suspicion or a sanctions match.

  '
disposition: ESCALATE_SAR
escalation_decision: 'Make a prompt internal disclosure to the nominated officer/MLRO. This is not an
  L2-only referral. Disclosure summary: 218 credits totalling 2,083,781.32 from 20 senders between 3 and
  9 March 2023 into a student account, the main senders each making 12 payments; onward payment of 42,398.74
  to a Germany-located recipient.

  Material counterparties to include: 5256975073, 4063217673, 2531083492 (Japan), 3589086554, 1977207928
  (Germany), 1431954327.

  Follow-up actions, routed alongside the disclosure without delaying it: confirm whether funds have since
  moved; screen the customer and the counterparties listed. Owner: the TM/L2 team or the MLRO, as determined
  under the firm''s procedure (not available in this simulation).

  The investigator must not tell the customer or counterparties that an internal disclosure has been made
  or that an investigation is contemplated or being conducted, where that would be likely to prejudice
  an investigation (POCA s.333A). This is not a blanket bar on customer contact: any request for information
  is to be agreed with the MLRO or an appropriate specialist and worded neutrally.

  The case pack does not identify a pending transaction requiring a consent decision. If a proposed transaction
  may constitute a money laundering offence and the firm intends to proceed, the matter is referred to
  the MLRO, who decides whether a DAML request is required. The investigator does not seek a DAML or restrict
  or release account activity outside delegated authority.

  Recommend a CDD refresh and customer risk-rating review: the recorded rating of Low and expected monthly
  credits of 0–833 require reassessment against the observed activity. Assign to the CDD/KYC owner with
  a due date in the restricted remediation tracker; any customer-facing refresh request is assessed first
  so that it does not disclose the internal report or prejudice an investigation. These actions do not
  replace the escalation.

  Timing: the project''s operational target is internal disclosure on the same working day that suspicion
  is formed; the statutory requirement, where POCA s.330 applies, is disclosure as soon as is practicable.
  The simulation contains no record of when suspicion was formed or the disclosure was made, so the disclosure-tracking
  fields are left null rather than estimated, and case opening and closure dates are not recorded.

  '
