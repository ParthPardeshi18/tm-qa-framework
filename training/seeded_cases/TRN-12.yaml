red_flags_identified:
- 'Turnover materially inconsistent with the declared business: 138 credits totalling 1,246,835.49 and
  132 debits totalling 918,596.84 in the 90-day lookback against declared turnover of 0–50,000 a year
  (expected monthly credits 0–4,167).'
- 'Sustained high volume rather than a single burst: credits of about 457k, 357k and 434k in the three
  30-day blocks.'
- 'Two-way flows with one counterparty: 1960345643 sent 24 credits totalling 223,101.65 and received 18
  debits totalling 217,177.03.'
- 'Concentrated counterparties: 11 senders and 11 receivers; the largest senders were 9747504007 (23 credits,
  356,824.82), 1085502765 (24, 228,698.50) and 3568250923 (20, 226,577.23); the largest receivers were
  1960345643 and 6926473983 (19 debits, 171,322.49).'
- 'TM02 trigger: credits of 50,298.00 and debits of 64,469.49 (128%) on 14–15 February 2023.'
source_of_funds: 'Source of funds is unresolved. Credits come from 11 domestic counterparties by ACH,
  cheque and card, at a steady rate over three months, with no cash and no cross-border element. The pattern
  is consistent in form with business receipts, but the volume (about 1.25 million in 90 days) is far
  beyond the declared turnover of a hairdressing business, and the nature of the business relationships
  is not evidenced.

  Source of wealth is relevant to the business''s owners because of the gap between declared and observed
  turnover; no business accounts or ownership information are available.

  Investigative actions not evidenced as completed in the case pack: establishing the business''s actual
  activity and turnover; identifying the main counterparties and the reason for two-way flows with 1960345643;
  and obtaining business records.

  The source of funds and source of wealth cannot be treated as established or verified on the available
  record.

  '
screening_adverse_media: 'No screening results are available in the simulation dataset; screening outcomes
  cannot be verified. The synthetic customer profile records PEP No and adverse media No as KYC flags
  on file; these are profile attributes, not evidence of completed screening or clear results.

  Screening of the customer and material counterparties is not evidenced as completed in the case pack.
  Parties for assessment: the customer and its owners or controllers; senders 9747504007, 1085502765 and
  3568250923; two-way counterparty 1960345643; and receivers 6926473983, 6149643353 and 856923499. The
  data contains account identifiers and bank locations but no names, so screening outcomes cannot be verified;
  adverse-media and PEP checks on material counterparties are also not evidenced as completed.

  No cross-border activity is recorded in the lookback, so no jurisdiction-specific sanctions consideration
  arises from the transactions themselves.

  '
rationale: 'The material concerns are not resolved, but on the current record they point first to a KYC
  discrepancy and need specialist assessment before a suspicion can be formed or excluded.

  The greatest weight is given to scale: about 1.25 million of credits in 90 days through a business declared
  at 0–50,000 a year. The two-way flows with 1960345643 (223,101.65 in, 217,177.03 out) are a material
  question because circular payments can be used to inflate turnover or layer funds. However, the activity
  is sustained and regular over three months, domestic, cash-free and spread across a stable group of
  counterparties, which is consistent with a genuine trading relationship conducted through an account
  whose KYC is out of date. The TM02 trigger (128% out within two days) is consistent with this steady
  pattern and is given limited weight.

  Legitimate explanations considered include business growth or a change of activity not reflected in
  KYC, and supplier-customer relationships producing two-way payments. These remain untested but are not
  contradicted by the transaction evidence.

  [Correction 2026-10-21: a reference to a later-dated alert, listed in error in the original case pack,
  was removed; it was not relied upon.] Limitations: the transaction currency is unverified; the customer
  profile is synthetic and is the KYC record against which activity is assessed in this simulation; the
  jurisdiction watchlist is a single June 2023 snapshot rather than a classification verified for the
  transaction dates; and the meaning of Sender_account for cash deposits is undocumented. These limitations
  reduce precision but do not change the assessment that the key questions are about the nature of the
  business.

  ESCALATE_L2 is proportionate: L2 should establish the actual business and the reason for the circular
  flows. If the circular flows cannot be explained, internal disclosure must follow promptly.

  '
disposition: ESCALATE_L2
escalation_decision: 'Refer to the L2 Transaction Monitoring team for specialist assessment of: (1) the
  business''s actual activity and turnover; (2) the relationship with 1960345643 and the reason for two-way
  flows of 223,101.65 in and 217,177.03 out; (3) the identity of senders 9747504007, 1085502765 and 3568250923;
  and (4) screening of the customer, its controllers and the main counterparties.

  Internal disclosure is not made at this stage because the sustained, domestic, cash-free pattern across
  a stable counterparty group is consistent with an under-declared trading business; the circular flows
  are a material question for specialist review rather than, on their own, grounds for suspicion.

  Any request for information is to be agreed with L2 or the MLRO and worded neutrally; the tipping-off
  restriction (POCA s.333A) applies if suspicion is later formed.

  Recommend a CDD refresh and customer risk-rating review: the recorded rating of Medium and expected
  monthly credits of 0–4,167 require reassessment against the observed activity. Assign to the CDD/KYC
  owner with a due date in the restricted remediation tracker; any customer-facing refresh request is
  assessed first so that it does not disclose the internal report or prejudice an investigation. These
  actions do not replace the escalation.

  No internal disclosure is made at this stage, so the disclosure-tracking fields are null. The simulation
  contains no case-handling record, so opening and closure dates are not recorded. If L2 or any later
  review forms a suspicion, prompt internal disclosure to the nominated officer/MLRO is required and must
  not wait for completion of L2 work. The firm''s detailed escalation procedure is not available in this
  simulation.

