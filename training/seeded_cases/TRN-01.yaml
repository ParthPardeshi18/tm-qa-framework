source_of_funds: 'Source of funds is unresolved. All credits came from one overseas sender. A single,
  regular foreign remitter is consistent in form with family support or education funding for a student,
  but 220,063.45 in 30 days is far beyond any plausible living or tuition costs implied by the profile,
  and the sender''s identity and relationship to the customer are not evidenced.

  Source of wealth is relevant to the remitter rather than the customer; no information is available about
  the sender''s wealth or the purpose of the payments.

  Investigative actions not evidenced as completed in the case pack: identifying sender 7592950832 and
  their relationship to the customer; establishing the purpose of the payments; and establishing whether
  further payments or onward transfers have occurred.

  The source of funds and source of wealth cannot be treated as established or verified on the available
  record.

  '
screening_adverse_media: 'No screening results are available in the simulation dataset; screening outcomes
  cannot be verified. The synthetic customer profile records PEP No and adverse media No as KYC flags
  on file; these are profile attributes, not evidence of completed screening or clear results.

  Screening of the customer and material counterparties is not evidenced as completed in the case pack.
  Parties for assessment: the customer and the Nigeria-located sender 7592950832. The data contains account
  identifiers and bank locations but no names, so screening outcomes cannot be verified; adverse-media
  and PEP checks on material counterparties are also not evidenced as completed.

  The cross-border activity raises a sanctions-control consideration. The available evidence does not
  establish any sanctions match or connection to a sanctioned person or entity. Appearance on the project''s
  historical June 2023 jurisdiction watchlist is not, by itself, evidence of a sanctions match.

  '
rationale: 'The material concerns are not resolved, and the case is borderline, but on the current record
  I do not yet form a suspicion; specialist assessment is needed to test the most likely legitimate explanation.

  Weight is given to the scale (220,063.45 in 30 days against expected monthly credits of up to 833) and
  to the account''s recent opening. The pattern, however, is a single identifiable remitter making regular
  payments, with no onward movement, dispersal, cash or multi-party activity. That is consistent in form
  with family or education funding for a student, which counterparty identification and a carefully worded
  request for information could confirm or exclude. The sender''s location on the project''s historical
  watchlist is context, not evidence of suspicion on its own.

  Legitimate explanations considered include family support, tuition or accommodation funding, and the
  transfer of family savings. None is substantiated, and the amount strains each of them, which is why
  the case is escalated rather than closed.

  Limitations: the transaction currency is unverified; the customer profile is synthetic and is the KYC
  record against which activity is assessed in this simulation; the jurisdiction watchlist is a single
  June 2023 snapshot rather than a classification verified for the transaction dates; and the meaning
  of Sender_account for cash deposits is undocumented. These limitations reduce precision but do not change
  the assessment that the decisive evidence is the identity of the remitter and the purpose of the payments.

  ESCALATE_L2 is proportionate. A second reviewer could reasonably conclude that suspicion is already
  formed; if L2 cannot promptly establish a legitimate purpose, internal disclosure must follow without
  delay.

  '
disposition: ESCALATE_L2
escalation_decision: 'Refer to the L2 Transaction Monitoring team for specialist assessment of: (1) the
  identity of Nigeria-located sender 7592950832 and the relationship to the customer; (2) the purpose
  of the 13 payments totalling 220,063.45; (3) whether the funds have since been moved on; and (4) screening
  of the customer and the sender.

  Internal disclosure is not made at this stage because the activity is a single identifiable remitter
  with no onward movement, consistent in form with family or education funding; the evidence needed to
  test that explanation is not in the case pack. Given the scale, L2 should treat the case as a priority.

  Any request for information is to be agreed with L2 or the MLRO and worded neutrally; the tipping-off
