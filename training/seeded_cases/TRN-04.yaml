red_flags_identified:
- 'Burst of credits inconsistent with the profile: 241 credits totalling 2,955,619.38 from 21 senders
  between 24 and 30 July 2023, against declared income of 10,000–25,000 and expected monthly credits of
  833–2,083.'
- 'Repetitive multi-sender pattern: the largest senders each made 12 payments — 2911400609 (263,612.39),
  8327812626 (256,996.12), 9407248599 (237,112.92) and 1140645531 (194,777.05), by ACH, cheque and card.'
- 'Sharp change in activity: credits of about 9,000 in May and 26,000 in June 2023 before July credits
  of about 2.96 million.'
- 'Funds retained: no debits in the alert window; lookback debits total 18,102.33, including 18,053.21
  to 5946937708 in May 2023.'
source_of_funds: 'Source of funds is unresolved. Credits of 2,955,619.38 arrived from 21 senders within
  seven days, the main senders each making 12 payments. Neither the senders'' relationship to the customer
  nor the purpose of the payments is evidenced.

  Source of wealth is relevant because the funds received are more than 100 times the upper end of declared
  annual income; no asset or wealth information is available.

  Investigative actions not evidenced as completed in the case pack: identifying the senders and their
  relationship to the customer; establishing the purpose of the payments; and confirming whether funds
  have since been moved on.

  The source of funds and source of wealth cannot be treated as established or verified on the available
  record.

  '
screening_adverse_media: 'No screening results are available in the simulation dataset; screening outcomes
  cannot be verified. The synthetic customer profile records PEP No and adverse media No as KYC flags
  on file; these are profile attributes, not evidence of completed screening or clear results.

  Screening of the customer and material counterparties is not evidenced as completed in the case pack.
  Parties for assessment: the customer; senders 2911400609, 8327812626, 9407248599 and 1140645531; and
  payee 5946937708. The data contains account identifiers and bank locations but no names, so screening
  outcomes cannot be verified; adverse-media and PEP checks on material counterparties are also not evidenced
  as completed.

  No cross-border activity is recorded in the lookback, so no jurisdiction-specific sanctions consideration
  arises from the transactions themselves.

  '
rationale: 'The material concerns are resolved on the available record.

  The greatest weight is given to the receipt of 2,955,619.38 from 21 senders within a week, the main
  senders each making exactly 12 payments, after months of low activity. Repetition of this kind across
  senders has no visible economic purpose for a care worker''s account. The funds were retained at the
  alert date, so onward movement cannot be assessed.

  Legitimate explanations considered include an inheritance, a property sale and family support. A single-event
  receipt would not arrive as repeated payments from 21 senders, and none is substantiated.

  Limitations: the transaction currency is unverified; the customer profile is synthetic and is the KYC
  record against which activity is assessed in this simulation; the jurisdiction watchlist is a single
  June 2023 snapshot rather than a classification verified for the transaction dates; and the meaning
  of Sender_account for cash deposits is undocumented. These limitations reduce precision but do not resolve
  the multi-sender collection pattern on which the suspicion is based.

  The credits are consistent with family members pooling funds for the customer. No suspicion is formed
  and the alert is closed with no further action.

  '
