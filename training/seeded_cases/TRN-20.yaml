red_flags_identified:
- 'Burst of outflows inconsistent with the profile: 260 debits totalling 2,325,265.34 to 20 receivers,
  all in March 2023, against declared income of 25,000–40,000 and expected monthly credits of 2,083–3,333.'
- 'Repetitive payee pattern: the largest receivers each received 13 payments — 1967745999 (225,894.74),
  8600671502 (187,864.74), 7879331321 (177,898.12) and 6853248322 (173,878.65); 13 debits each also went
  to an Albania-located recipient (99,130.51) and a Spain-located recipient (61,300.39).'
- 'Two-way flows with a Nigeria-located counterparty: 3 credits totalling 93,483.17 from 1910374646 in
  the lookback and, per review of the available earlier activity, a cross-border debit of 387,488.32 to
  the same identifier on 2022-11-27.'
- 'Funding gap: debits exceed lookback credits (95,363.36) by 2,229,901.98. Opening balance is unavailable.'
- 'Prior alert: TM03-00658 (high-risk jurisdiction) on 2022-11-27, before the lookback; its triggering
  transaction (387,488.32 to Nigeria) was reviewed from the available earlier data.'
source_of_funds: 'Source of funds is unresolved. The only material credits are 93,483.17 from a Nigeria-located
  counterparty that had itself received 387,488.32 from the customer in November 2022. The March outflows
  of 2,325,265.34 were funded from money not visible in the case pack.

  Source of wealth is relevant because the March outflows alone are more than 50 times the upper end of
  declared annual income; no asset or wealth information is available.

  Investigative actions not evidenced as completed in the case pack: establishing how the March outflows
  were funded; identifying the 20 receivers and the Nigeria-located counterparty 1910374646; and establishing
  the purpose of the repeated payments.

  The source of funds and source of wealth cannot be treated as established or verified on the available
  record.

  '
screening_adverse_media: 'No screening results are available in the simulation dataset; screening outcomes
  cannot be verified. The synthetic customer profile records PEP No and adverse media No as KYC flags
  on file; these are profile attributes, not evidence of completed screening or clear results.

  Screening of the customer and material counterparties is not evidenced as completed in the case pack.
  Parties for assessment: the customer; Nigeria-located counterparty 1910374646; receivers 1967745999,
  8600671502, 7879331321 and 6853248322; and the Albania-located and Spain-located recipients. The data
  contains account identifiers and bank locations but no names, so screening outcomes cannot be verified;
  adverse-media and PEP checks on material counterparties are also not evidenced as completed.

  The cross-border activity raises a sanctions-control consideration. The available evidence does not
  establish any sanctions match or connection to a sanctioned person or entity. Appearance on the project''s
  historical June 2023 jurisdiction watchlist is not, by itself, evidence of a sanctions match.

  '
rationale: 'The material concerns are not resolved on the available record. I suspect the customer is
  engaged in money laundering, with the account used to disperse large sums to multiple recipients, including
  overseas.

  The greatest weight is given to the dispersal of 2,325,265.34 in one month to 20 receivers, the main
  receivers each taking exactly 13 payments, funded from money not visible. The two-way flows with Nigeria-located
  1910374646 (387,488.32 out in November, 93,483.17 back in the lookback) add weight as an unexplained
  round-trip. Payments to an Albania-located recipient provide context.

  Earlier-alert rule: the prior alert TM03-00658 fell before the lookback, so review was not mandatory,
  but its triggering transaction was reviewed because it involves the same counterparty as the lookback
  credits. The earlier data available covers 2022-11-19 to 2022-11-27 only.

  Legitimate explanations considered include the sale of an asset and transfers between own accounts.
  Neither explains repeated payments to 20 receivers, and neither is substantiated.

  Limitations: the transaction currency is unverified; the customer profile is synthetic and is the KYC
  record against which activity is assessed in this simulation; the jurisdiction watchlist is a single
  June 2023 snapshot rather than a classification verified for the transaction dates; and the meaning
  of Sender_account for cash deposits is undocumented. These limitations reduce precision but do not resolve
  the dispersal pattern on which the suspicion is based.

  I therefore recommend prompt internal disclosure. This is a suspicion, not a finding that criminality
  is proven; the MLRO decides whether an external SAR is required. The record does not establish a terrorist-financing
  suspicion or a sanctions match.

  '
disposition: ESCALATE_SAR
escalation_decision: 'Make a prompt internal disclosure to the nominated officer/MLRO. This is not an
  L2-only referral. Disclosure summary: 260 debits totalling 2,325,265.34 to 20 receivers in March 2023,
  the main receivers each taking 13 payments, against lookback credits of 95,363.36; two-way flows with
  Nigeria-located 1910374646 (387,488.32 out on 2022-11-27, 93,483.17 in during the lookback); prior alert
  TM03-00658.

  Material counterparties to include: 1910374646 (Nigeria), 1967745999, 8600671502, 7879331321, 6853248322,
  the Albania-located recipient.

  Follow-up actions, routed alongside the disclosure without delaying it: obtain balance and funding of
  the March outflows; screen the customer and the counterparties listed. Owner: the TM/L2 team or the
  MLRO, as determined under the firm''s procedure (not available in this simulation).

  The investigator must not tell the customer or counterparties that an internal disclosure has been made
  or that an investigation is contemplated or being conducted, where that would be likely to prejudice
  an investigation (POCA s.333A). This is not a blanket bar on customer contact: any request for information
  is to be agreed with the MLRO or an appropriate specialist and worded neutrally.

  The case pack does not identify a pending transaction requiring a consent decision. If a proposed transaction
  may constitute a money laundering offence and the firm intends to proceed, the matter is referred to
  the MLRO, who decides whether a DAML request is required. The investigator does not seek a DAML or restrict
  or release account activity outside delegated authority.

  Recommend a CDD refresh and customer risk-rating review: the recorded rating of Low and expected monthly
  credits of 2,083–3,333 require reassessment against the observed activity. Assign to the CDD/KYC owner
  with a due date in the restricted remediation tracker; any customer-facing refresh request is assessed
  first so that it does not disclose the internal report or prejudice an investigation. These actions
  do not replace the escalation.

  Timing: the project''s operational target is internal disclosure on the same working day that suspicion
  is formed; the statutory requirement, where POCA s.330 applies, is disclosure as soon as is practicable.
  The simulation contains no record of when suspicion was formed or the disclosure was made, so the disclosure-tracking
  fields are left null rather than estimated, and case opening and closure dates are not recorded.

  '
