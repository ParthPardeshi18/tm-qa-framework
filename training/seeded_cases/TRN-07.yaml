  of 10,000–25,000 and expected monthly credits of 833–2,083.'
- 'Earlier multi-sender burst: 85 credits totalling about 606,000 between 3 February and 4 March 2023
  from repeat senders, including 7644116798 (12 credits, 158,685.79), 5034577274 (12, 116,480.89) and
  3741458403 (12, 70,175.55).'
- 'Regular cash deposits from one identifier: 2,937.08 (9 February), 3,468.49 (23 March) and 3,258.67
  (20 April 2023), all recorded against 3529803414.'
- 'Funds retained: debits total 636.77 (4 cash withdrawals) across the lookback, leaving 5,047,969.39
  unspent within the period.'
source_of_funds: 'Source of funds is unresolved. The account received a single credit of 4,435,401.96
  from 717880712 and, earlier, about 606,000 from repeat senders each making 12 payments. Neither is consistent
  with the declared occupation, and neither the senders'' relationship to the customer nor the purpose
  of the payments is evidenced.

  Source of wealth is relevant because the funds received are about 200 times the upper end of declared
  annual income; no asset or wealth information is available.

  Investigative actions not evidenced as completed in the case pack: establishing the source and purpose
  of the 4,435,401.96 credit; identifying 717880712 and the February senders; and confirming whether funds
  have since been moved on.

  The source of funds and source of wealth cannot be treated as established or verified on the available
  record.

  '
screening_adverse_media: 'No screening results are available in the simulation dataset; screening outcomes
  cannot be verified. The synthetic customer profile records PEP No and adverse media No as KYC flags
  on file; these are profile attributes, not evidence of completed screening or clear results.

  Screening of the customer and material counterparties is not evidenced as completed in the case pack.
  Parties for assessment: the customer; sender 717880712; senders 7644116798, 5034577274 and 3741458403;
  and cash identifier 3529803414. The data contains account identifiers and bank locations but no names,
  so screening outcomes cannot be verified; adverse-media and PEP checks on material counterparties are
  also not evidenced as completed.

  No cross-border activity is recorded in the lookback, so no jurisdiction-specific sanctions consideration
  arises from the transactions themselves.

  '
rationale: 'The material concerns are not resolved on the available record. I suspect the customer is
  engaged in money laundering, with the account used to receive and hold large third-party funds.

  Weight is divided between two features. The single credit of 4,435,401.96 could, in isolation, have
  a single-event legitimate explanation such as an inheritance, compensation or a sale, which documentation
  could confirm. However, the earlier receipt of about 606,000 from repeat senders each making 12 payments
  is not explained by any single event, and the combination of both into the account of a care worker
  has no visible purpose. The monthly cash deposits (about 3,000 each) are modest and carry little weight.
  The funds were retained, so onward movement cannot be assessed.

  Legitimate explanations considered include an inheritance, compensation and an asset sale (which could
  explain the single large credit) and family support (which does not fit the scale). None is substantiated,
  and none explains both features.

  Limitations: the transaction currency is unverified; the customer profile is synthetic and is the KYC
  record against which activity is assessed in this simulation; the jurisdiction watchlist is a single
  June 2023 snapshot rather than a classification verified for the transaction dates; and the meaning
  of Sender_account for cash deposits is undocumented. These limitations reduce precision but do not resolve
  the combined pattern on which the suspicion is based.

  On balance the large credit is most likely an inheritance and the earlier receipts family support. No
  suspicion is formed.

  '
