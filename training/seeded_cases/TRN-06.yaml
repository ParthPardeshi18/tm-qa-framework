red_flags_identified:
- 'Burst of outflows inconsistent with the profile: 183 debits totalling 1,478,572.42 to 26 receivers
  between 20 and 26 April 2023; lookback debits of 1,890,630.18 to 43 receivers against declared income
  of 40,000–60,000 and expected monthly credits of 3,333–5,000.'
- 'Funding not visible: the only credits are 9 cash deposits totalling 15,895.59 from three identifiers;
  debits exceed credits by 1,874,734.59. Opening balance is unavailable.'
- 'Repetitive payee pattern: 3270025276 (13 debits, 173,469.49), 6876346307 (13, 173,118.81), 7251460966
  (13, 126,795.82) and 7549210780 (12, 126,241.95).'
- 'Cross-border debits: 13 to India-located recipients (120,481.37), 13 to Japan-located recipients (89,939.18)
  and 5 to Nigeria-located recipients (14,537.06, watchlist).'
source_of_funds: 'Source of funds is unresolved. Outflows of 1,890,630.18 were funded almost entirely
  from money not visible in the case pack; the only credits are cash deposits of 15,895.59, which are
  small and uneven.

  Source of wealth is relevant because the outflows are more than 30 times the upper end of declared annual
  income; no asset or wealth information is available.

  Investigative actions not evidenced as completed in the case pack: establishing how the outflows were
  funded; identifying the receivers and their relationship to the customer; and establishing the origin
  of the cash deposits.

  The source of funds and source of wealth cannot be treated as established or verified on the available
  record.

  '
screening_adverse_media: 'No screening results are available in the simulation dataset; screening outcomes
  cannot be verified. The synthetic customer profile records PEP No and adverse media No as KYC flags
  on file; these are profile attributes, not evidence of completed screening or clear results.

  Screening of the customer and material counterparties is not evidenced as completed in the case pack.
  Parties for assessment: the customer; payees 3270025276, 6876346307, 7251460966 and 7549210780; and
  the India-located, Japan-located and Nigeria-located recipients. The data contains account identifiers
  and bank locations but no names, so screening outcomes cannot be verified; adverse-media and PEP checks
  on material counterparties are also not evidenced as completed.

  The cross-border activity raises a sanctions-control consideration. The available evidence does not
  establish any sanctions match or connection to a sanctioned person or entity. Appearance on the project''s
  historical June 2023 jurisdiction watchlist is not, by itself, evidence of a sanctions match.

  '
rationale: 'The material concerns are not significant enough to escalate.

  The greatest weight is given to the dispersal of 1,478,572.42 to 26 receivers in one week, with the
  main payees each taking 12–13 payments, funded from money not visible. The cash deposits (15,895.59)
  are small, uneven and given little weight. The Nigeria-located payments provide context only.

  Legitimate explanations considered include savings or an asset sale. These might explain a large outflow
  but not repeated payments to many recipients, and neither is substantiated.

  Limitations: the transaction currency is unverified; the customer profile is synthetic and is the KYC
  record against which activity is assessed in this simulation; the jurisdiction watchlist is a single
  June 2023 snapshot rather than a classification verified for the transaction dates; and the meaning
  of Sender_account for cash deposits is undocumented. These limitations reduce precision but do not resolve
  the dispersal pattern on which the suspicion is based.

  The outflows are assumed to be funded from the customer''s savings. The alert is closed.

  '
disposition: CLOSE_NO_FURTHER_ACTION
escalation_decision: 'No escalation required.

