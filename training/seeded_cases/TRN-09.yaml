- 'Large third-party credits: one cross-border credit of 65,689.16 from an Austria-located sender (1333336171)
  and 3 debit-card credits totalling 81,969.32 from 6242077553.'
- 'Repeated cash deposits from several sources (per transaction-level review): 16 cash deposits totalling
  36,730.59 recorded against five identifiers between 31 March and 27 June 2023. The TM01 trigger comprised
  3 in-band deposits from three different identifiers on 26–27 June 2023 (15,111.72).'
- 'Concentrated payees: 1413443599 (12 debits, 111,296.03), 1521179267 (4, 58,882.51), 9995538228 (8,
