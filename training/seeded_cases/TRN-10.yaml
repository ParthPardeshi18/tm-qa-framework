red_flags_identified:
- 'Outflows materially inconsistent with the profile: 73 debits totalling 473,288.78 to 28 receivers in
  the 90-day lookback against declared income of 25,000–40,000 and expected monthly credits of 2,083–3,333.'
- 'Repeated cash deposits beyond declared income: 16 cash deposits totalling 52,147.45 (per transaction-level
  review), 13 recorded against identifier 9634559331 (40,454.56) and 3 against 7345520483 (11,692.89),
  including runs on consecutive days in March and May 2023. The TM01 trigger comprised 3 in-band deposits
  totalling 14,949.18 in the week to 19 May 2023.'
- 'Matching cheques in and out: a cheque credit of 46,431.56 from 7890110062 and a cheque debit of 46,275.38
  to the same identifier within the review period.'
- 'Cross-border outflows: 72 cross-border debits totalling 427,013.40, including 8 to a France-located
  recipient (5861366553, 137,934.20), 2 to Germany-located recipients (39,543.83), 1 to a Turkey-located
  recipient (9,716.44) and 61 to UK-located receivers (239,818.93).'
- 'Account recorded under two bank locations (per transaction-level review): the 72 cross-border debits
  record the account at a UAE bank location, while its credits and remaining debit record it at a UK bank.
  This may be a data-quality issue and needs confirmation before reliance.'
- 'Funding gap: debits exceed credits (98,579.01) by 374,709.77. Opening balance is unavailable and the
  investigator data contains no activity before 2023-02-19.'
source_of_funds: 'Source of funds is unresolved. Recorded credits comprise 16 cash deposits (52,147.45)
  and one cheque (46,431.56). Cash income is plausible in type for an electrician, but 52,147.45 in 90
  days exceeds the customer''s declared annual income. The cheque credit is matched by a cheque debit
  of 46,275.38 to the same counterparty, so it does not explain the wider outflows. The funds behind debits
  that exceed credits by 374,709.77 are not visible.

  Source of wealth is relevant because the recorded outflows are more than ten times the declared annual
  income; no asset or wealth information is available.

  Investigative actions not evidenced as completed in the case pack: establishing the origin of the cash
  deposits and the identity behind identifiers 9634559331 and 7345520483; establishing the purpose of
  the matched cheques with 7890110062; confirming whether the UAE-located debits belong to this customer;
  and obtaining the balance and earlier history.

  The source of funds and source of wealth cannot be treated as established or verified on the available
  record.

  '
screening_adverse_media: 'No screening results are available in the simulation dataset; screening outcomes
  cannot be verified. The synthetic customer profile records PEP No and adverse media No as KYC flags
  on file; these are profile attributes, not evidence of completed screening or clear results.

  Screening of the customer and material counterparties is not evidenced as completed in the case pack.
  Parties for assessment: the customer; cash-deposit identifiers 9634559331 and 7345520483; cheque counterparty
  7890110062; the France-located recipient 5861366553; receiver 4219885901 (6 debits, 97,454.95); and
  the Germany-located and Turkey-located recipients. The data contains account identifiers and bank locations
  but no names, so screening outcomes cannot be verified; adverse-media and PEP checks on material counterparties
  are also not evidenced as completed.

  The cross-border activity raises a sanctions-control consideration. The available evidence does not
  establish any sanctions match or connection to a sanctioned person or entity. Appearance on the project''s
  historical June 2023 jurisdiction watchlist is not, by itself, evidence of a sanctions match.

  '
rationale: 'The material concerns are not resolved on the available record. I suspect the customer is
  engaged in money laundering, using the account to place cash and pass funds on to third parties at a
  scale far beyond declared means.

  The greatest weight is given to the cash: 16 deposits totalling 52,147.45 in 90 days, mostly against
  one identifier and in runs of consecutive daily deposits, exceed the declared annual income of 25,000–40,000.
  The TM01 trigger is part of this wider pattern rather than the basis of the suspicion on its own. The
  matched cheques (46,431.56 in and 46,275.38 out with the same counterparty) add weight as a possible
  round-trip with no visible purpose.

  The 72 cross-border debits (427,013.40) are given qualified weight. They record the account at a UAE
  bank location, which may be a data-quality issue; their attribution is referred for confirmation. Even
  excluding them, the cash pattern and the matched cheques are unexplained and inconsistent with the profile.

  Legitimate explanations considered include cash trade income, savings and transfers between related
  accounts. None is substantiated, and cash income of this size is not consistent with the declared income
  band.

  Limitations: the transaction currency is unverified; the customer profile is synthetic and is the KYC
  record against which activity is assessed in this simulation; the jurisdiction watchlist is a single
  June 2023 snapshot rather than a classification verified for the transaction dates; and the meaning
  of Sender_account for cash deposits is undocumented. These limitations reduce precision but do not resolve
  the cash and cheque pattern on which the suspicion primarily rests.

  I therefore recommend prompt internal disclosure. This is a suspicion, not a finding that criminality
  is proven; the MLRO decides whether an external SAR is required. The record does not establish a terrorist-financing
  suspicion or a sanctions match.

  '
disposition: ESCALATE_SAR
escalation_decision: 'Make a prompt internal disclosure to the nominated officer/MLRO. This is not an
  L2-only referral. Disclosure summary: 16 cash deposits totalling 52,147.45 in 90 days against declared
  income of 25,000–40,000; matched cheques of 46,431.56 in and 46,275.38 out with 7890110062; debits of
  473,288.78 against credits of 98,579.01; and 72 cross-border debits (427,013.40) recorded with the account
  at a UAE bank location, attribution to be confirmed.

  Material counterparties to include: cash identifiers 9634559331 and 7345520483; cheque counterparty
  7890110062; France-located recipient 5861366553; receiver 4219885901.

  Follow-up actions, routed alongside the disclosure without delaying it: confirm attribution of the UAE-located
  debits; obtain balance and history before 2023-02-19; screen the customer and the counterparties listed.
  Owner: the TM/L2 team or the MLRO, as determined under the firm''s procedure (not available in this
  simulation).

  The investigator must not tell the customer or counterparties that an internal disclosure has been made
  or that an investigation is contemplated or being conducted, where that would be likely to prejudice
  an investigation (POCA s.333A). This is not a blanket bar on customer contact: any request for information
  is to be agreed with the MLRO or an appropriate specialist and worded neutrally.

  The case pack does not identify a pending transaction requiring a consent decision. If a proposed transaction
  may constitute a money laundering offence and the firm intends to proceed, the matter is referred to
  the MLRO, who decides whether a DAML request is required. The investigator does not seek a DAML or restrict
  or release account activity outside delegated authority.

  Recommend a CDD refresh and customer risk-rating review: the recorded rating of Low and expected monthly
  credits of 2,083–3,333 require reassessment against the observed activity. Assign to the CDD/KYC owner
  with a due date in the restricted remediation tracker; any customer-facing refresh request is assessed
  first so that it does not disclose the internal report or prejudice an investigation. These actions
  do not replace the escalation.

  Timing: the project''s operational target is internal disclosure on the same working day that suspicion
  is formed; the statutory requirement, where POCA s.330 applies, is disclosure as soon as is practicable.
  The simulation contains no record of when suspicion was formed or the disclosure was made, so the disclosure-tracking
  fields are left null rather than estimated, and case opening and closure dates are not recorded.

